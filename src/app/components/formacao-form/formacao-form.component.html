<form class="form-container" id="formFormacao" [formGroup]="formFormacao">
  <div>
    <p-button (click)="showDialog()" label="+ Adicionar" />
  </div>

  <p-dialog header="Adicionar Formação" [modal]="true" [(visible)]="visible" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [style]="{ width: '50vw' }" [draggable]="false" [resizable]="false">
    <div class="dialog-input-container" id="row15">
      <div class="input-container">
        <label for="username" class="font-semibold w-24">Username</label>
        <input pInputText id="username" class="flex-auto" autocomplete="off" />
      </div>

      <div class="input-container">
        <label for="email" class="font-semibold w-24">Email</label>
        <input pInputText id="email" class="flex-auto" autocomplete="off" />
      </div>
    </div>

    <div class="dialog-button-container">
        <p-button label="Cancelar" severity="secondary" (click)="visible = false" />
        <p-button label="Salvar" (click)="visible = false" />
    </div>
  </p-dialog>

</form>
